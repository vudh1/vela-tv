<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Vela</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="scene" aria-hidden="true"><div id="wallpaper" class="wallpaper"></div><div class="scrim"></div></div>
<main class="page">
  <header class="topline"><button id="profileButton" class="brand profile-button focusable" data-act="profiles" aria-label="Switch profile"></button><div class="top-actions"><button id="monitorButton" class="monitor-button focusable hidden" data-act="monitor" aria-label="Baby monitor" title="Baby monitor"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5" width="14.5" height="13.5" rx="3"/><path d="m17 9 4.5-2.5v10L17 14M6.5 22h7M10 18.5V22"/><circle cx="9.8" cy="11.5" r="2.1"/></svg></button><button id="calendarButton" class="calendar-button focusable" data-act="calendar" aria-label="Calendar" title="Calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M7 3v4m10-4v4M3 10h18m-13 5h3m3 0h3"/></svg><span id="calendarBadge" class="calendar-badge hidden"></span></button><button id="settingsButton" class="gear focusable" data-act="settings" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" width="25" height="25" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="M19.4 15a1.5 1.5 0 0 0 .3 1.65l.04.04-2 2-.04-.04a1.5 1.5 0 0 0-1.65-.3 1.5 1.5 0 0 0-.9 1.38V20h-2.9v-.27a1.5 1.5 0 0 0-.9-1.38 1.5 1.5 0 0 0-1.65.3l-.04.04-2-2 .04-.04a1.5 1.5 0 0 0 .3-1.65 1.5 1.5 0 0 0-1.38-.9H6v-2.9h.27a1.5 1.5 0 0 0 1.38-.9 1.5 1.5 0 0 0-.3-1.65l-.04-.04 2-2 .04.04a1.5 1.5 0 0 0 1.65.3 1.5 1.5 0 0 0 .9-1.38V5h2.9v.27a1.5 1.5 0 0 0 .9 1.38 1.5 1.5 0 0 0 1.65-.3l.04-.04 2 2-.04.04a1.5 1.5 0 0 0-.3 1.65 1.5 1.5 0 0 0 1.38.9H21v2.9h-.27a1.5 1.5 0 0 0-1.33 1.2Z" transform="translate(-1,-.5)"/></svg></button></div></header>
  <section class="hero"><div id="clock" class="clock" aria-live="off">--:--</div><div id="daydate" class="daydate"></div><div id="calendarPeek" class="calendar-peek" aria-live="off"></div></section>
  <section class="app-section"><div id="favorites" class="favorites dock" aria-label="Favorite applications"></div></section>
  <div id="focusLabel" class="focus-label" aria-live="polite"></div>
</main>
<div id="overlay" class="overlay hidden" role="dialog" aria-modal="true"><div class="panel"><div class="panel-header"><div><div class="eyebrow" id="panelEyebrow">VELA</div><h2 id="panelTitle">Settings</h2><p id="panelDescription"></p></div><button class="close focusable" data-act="close" aria-label="Close">✕</button></div><div id="panelContent" class="panel-body"></div><div class="panel-foot"><span>↑ ↓ ← → Navigate</span><span>OK Open · Hold OK Actions</span><span>Back Close</span></div></div></div>
<!-- Foreground-only event reminder; no TV focus, controls, or system-level overlay. -->
<div id="eventReminder" class="event-reminder" role="status" aria-live="polite" aria-hidden="true"><span class="reminder-mark" aria-hidden="true">◷</span><span class="reminder-copy"><span id="reminderWhen" class="reminder-when"></span><span id="reminderTitle" class="reminder-title"></span></span></div>
<!-- Non-interactive volume HUD; never enters D-pad focus order or triggers app scanning. -->
<div id="volumeHud" class="volume-hud glass bottom-center" aria-hidden="true" role="status">
  <span class="volume-glyph" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 5 6 9H3v6h3l5 4V5Z"/>
    <path class="volume-wave-small" d="M15 9a4.5 4.5 0 0 1 0 6"/>
    <path class="volume-wave-big" d="M18 6a8 8 0 0 1 0 12"/>
    <path class="volume-slash" d="m16 10 5 5m0-5-5 5"/>
  </svg></span>
  <span class="volume-track" aria-hidden="true"><span id="volumeFill" class="volume-fill"></span></span>
  <span id="volumeNumber" class="volume-number" aria-hidden="true"></span>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="qr.js"></script><script src="tizen-calendar.js"></script><script src="tizen-bridge.js"></script><script src="tizen-private-calendar.js"></script><script src="app.js"></script>
</body></html>
