name: Validate source
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android platform for Java compilation
        run: sdkmanager --install 'platforms;android-35'
      - name: Validate TV UI and assets
        run: python3 tests/validate.py
      - name: Test calendar event navigation and Home reminders
        run: node tests/calendar_ui_test.js
      - name: Test passive IP-weather, rain and cache expiry
        run: node tests/weather_test.js
      - name: Test Samsung adapter and staged shared app
        run: |
          node tests/tizen_bridge_test.js
          node tests/tizen_calendar_test.js
          bash scripts/build-tizen.sh stage
          test -f build/tizen/config.xml
          cmp app/src/main/assets/app.js build/tizen/app.js
      - name: Test LAN pairing form over local HTTP
        run: python3 tests/pairing_http_test.py
      - name: Compile native Java sources
        run: |
          mkdir -p build/ci-classes
          javac -source 8 -target 8 -classpath "$ANDROID_HOME/platforms/android-35/android.jar" \
            -d build/ci-classes app/src/main/java/com/danielvu/quiethome/*.java
