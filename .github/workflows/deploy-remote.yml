name: Deploy Vela remote Worker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'remote-worker/**'
      - '.github/workflows/deploy-remote.yml'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Cloudflare setup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Cloudflare deploy credentials missing'; exit 1; }
      - name: Install Worker tooling
        working-directory: remote-worker
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify isolated TV pairings before deployment
        run: node --test remote-worker/test/*.test.js
      - name: Deploy Worker
        working-directory: remote-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
