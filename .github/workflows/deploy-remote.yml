name: Deploy Vela remote Worker
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Cloudflare setup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VELA_REMOTE_PIN: ${{ secrets.VELA_REMOTE_PIN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Cloudflare deploy credentials missing'; exit 1; }
          [[ "$VELA_REMOTE_PIN" =~ ^[0-9]{8,12}$ ]] || { echo 'VELA_REMOTE_PIN must be 8–12 digits'; exit 1; }
      - name: Install Worker tooling
        working-directory: remote-worker
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Deploy Worker
        working-directory: remote-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Set private PIN (never exposed in source)
        working-directory: remote-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VELA_REMOTE_PIN: ${{ secrets.VELA_REMOTE_PIN }}
        run: printf '%s' "$VELA_REMOTE_PIN" | npx wrangler secret put REMOTE_PIN --name velatv-remote
