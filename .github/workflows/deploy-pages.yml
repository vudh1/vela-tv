name: Publish Vela web remote

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-pages.yml'
      - 'remote/**'
      - 'pages/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage only public web remote assets
        run: |
          mkdir -p "$RUNNER_TEMP/velatv-pages/remote"
          cp -R remote/. "$RUNNER_TEMP/velatv-pages/remote/"
          cp pages/index.html "$RUNNER_TEMP/velatv-pages/index.html"
          touch "$RUNNER_TEMP/velatv-pages/.nojekyll"
          test -f "$RUNNER_TEMP/velatv-pages/remote/index.html"
          test -f "$RUNNER_TEMP/velatv-pages/remote/app.js"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/velatv-pages
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
