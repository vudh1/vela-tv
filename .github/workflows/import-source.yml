name: Import Vela project source
on:
  push:
    branches: [main]
    paths:
      - source/Vela-2.5-SOURCE.zip
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract and validate source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vela-source"
          unzip -q source/Vela-2.5-SOURCE.zip -d "$RUNNER_TEMP/vela-source"
          SOURCE="$RUNNER_TEMP/vela-source/Vela-2.5-Production-Updates"
          test -f "$SOURCE/app/src/main/AndroidManifest.xml"
          test -f "$SOURCE/scripts/build.sh"
          # Keep repository workflows and release guidance authoritative.
          rsync -a --exclude='.github/' --exclude='README.md' \
            --exclude='*.jks' --exclude='*.apk' \
            "$SOURCE/" ./
          python3 tests/validate.py
      - name: Commit expanded source to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitignore build.gradle settings.gradle app preview scripts tests \
            THIRD-PARTY-NOTICES.md WALLPAPER-CREDITS.md signing/README.txt
          if git diff --cached --quiet; then
            echo 'Source already current'
          else
            git commit -m 'Import full Vela 2.5 source from reviewed archive'
            git push origin HEAD:main
          fi
